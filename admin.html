<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Light Crew AZ — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<!-- ══════════════ LOGIN PAGE ══════════════ -->
<div id="loginPage">
  <div class="login-wrap">
    <div class="login-bg-orbs"></div>
    <div class="login-card">

      <div class="login-logo">
        <span class="blink-dot"></span>
        LIGHT CREW AZ — ADMIN
      </div>

      <h1 class="login-title">Xoş<br>gəldiniz</h1>
      <p class="login-sub">Admin panelinə daxil olmaq üçün<br>məlumatlarınızı daxil edin</p>

      <div class="form-group">
        <label class="form-label">E-Mail</label>
        <input type="email" class="form-input" id="loginEmail"
          placeholder="admin@lightcrewaz.com" autocomplete="email">
      </div>

      <div class="form-group">
        <label class="form-label">Şifrə</label>
        <input type="password" class="form-input" id="loginPassword"
          placeholder="••••••••" autocomplete="current-password">
      </div>

      <button class="login-btn" id="loginBtn" onclick="doLogin()">
        Daxil ol
      </button>

      <div class="login-error" id="loginError"></div>

      <div class="login-footer">
        © 2024 Light Crew Azerbaijan &nbsp;·&nbsp; Secured
      </div>
    </div>
  </div>
</div>

<!-- ══════════════ ADMIN SHELL ══════════════ -->
<div id="adminShell" style="display:none">

  <!-- Sidebar overlay (mobile) -->
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

  <!-- ── Sidebar ─────────────────────────────────── -->
  <aside class="sidebar" id="sidebar">

    <div class="sidebar-logo">
      <div class="sidebar-logo-mark">
        <div class="logo-icon">
          <svg viewBox="0 0 14 14" fill="none" stroke="#060608" stroke-width="1.8" stroke-linecap="round">
            <path d="M7 1v3M7 10v3M1 7h3M10 7h3M3.05 3.05l2.12 2.12M8.83 8.83l2.12 2.12M3.05 10.95l2.12-2.12M8.83 5.17l2.12-2.12"/>
          </svg>
        </div>
        <span class="sidebar-logo-text">Light Crew AZ</span>
      </div>
      <span class="sidebar-logo-sub">Admin Panel</span>
    </div>

    <nav class="sidebar-nav">

      <span class="nav-section-label">Əsas</span>

      <a class="nav-item" data-page="dashboard" onclick="goTo('dashboard')">
        <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="1" y="1" width="6" height="6" rx="1.5"/>
          <rect x="9" y="1" width="6" height="6" rx="1.5"/>
          <rect x="1" y="9" width="6" height="6" rx="1.5"/>
          <rect x="9" y="9" width="6" height="6" rx="1.5"/>
        </svg>
        Dashboard
      </a>

      <a class="nav-item" data-page="team" onclick="goTo('team')">
        <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="6" cy="5" r="2.5"/>
          <path d="M1 13c0-2.76 2.24-5 5-5s5 2.24 5 5"/>
          <circle cx="12" cy="5" r="2"/>
          <path d="M11.5 11.5c.5-.16 1.5-.5 2.5-.5"/>
        </svg>
        Komanda
      </a>

      <a class="nav-item" data-page="portfolio" onclick="goTo('portfolio')">
        <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="1" y="3" width="14" height="10" rx="1.5"/>
          <path d="M5 3v10M11 3v10M1 8h14"/>
          <circle cx="3.5" cy="5.5" r="0.8" fill="currentColor"/>
          <circle cx="3.5" cy="10.5" r="0.8" fill="currentColor"/>
        </svg>
        Portfolio
      </a>

      <a class="nav-item" data-page="messages" onclick="goTo('messages')">
        <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M2 3a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1H5l-3 2V3z"/>
        </svg>
        Mesajlar
        <span class="nav-badge" id="msgBadge" style="display:none">0</span>
      </a>

      <span class="nav-section-label" style="margin-top:8px">Sistem</span>

      <a class="nav-item" data-page="settings" onclick="goTo('settings')">
        <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="8" cy="8" r="2.5"/>
          <path d="M8 1v1.5M8 13.5V15M1 8h1.5M13.5 8H15M3.4 3.4l1.06 1.06M11.54 11.54l1.06 1.06M3.4 12.6l1.06-1.06M11.54 4.46l1.06-1.06"/>
        </svg>
        Parametrlər
      </a>

    </nav>

    <div class="sidebar-footer">
      <div class="user-info">
        <div class="user-avatar" id="sidebarAvatar">A</div>
        <div>
          <div class="user-name" id="sidebarName">Admin</div>
          <div class="user-role" id="sidebarRole">Super Admin</div>
        </div>
      </div>
      <button class="logout-btn" onclick="doLogout()">
        <svg style="width:13px;height:13px;flex-shrink:0" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M6 3H3a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h3"/>
          <path d="M10 11l3-3-3-3M13 8H6"/>
        </svg>
        Çıxış
      </button>
    </div>

  </aside>

  <!-- ── Main ────────────────────────────────────── -->
  <div class="main-wrap">

    <header class="topbar">
      <div class="flex gap-12">
        <button class="mobile-menu-btn" onclick="openSidebar()">
          <svg style="width:16px;height:16px" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M2 4h12M2 8h12M2 12h12"/>
          </svg>
        </button>
        <div class="topbar-breadcrumb">
          <span class="topbar-site">LC ADMIN</span>
          <span class="topbar-sep">/</span>
          <span class="topbar-page" id="topbarPageName">DASHBOARD</span>
        </div>
      </div>
      <div class="topbar-right">
        <div class="topbar-indicator">
          <span class="topbar-indicator-dot"></span>
          Online
        </div>
        <span class="topbar-time" id="topbarTime"></span>
      </div>
    </header>

    <main class="content" id="mainContent">
      <!-- Pages injected here -->
    </main>

  </div>

</div>

<!-- ══════════════ MODAL ══════════════ -->
<div class="modal-overlay" id="globalModal">
  <div class="modal" id="globalModalInner"></div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
  // Sidebar helpers for mobile
  function openSidebar() {
    document.getElementById('sidebar').classList.add('open');
    document.getElementById('sidebarOverlay').classList.add('show');
  }
  function closeSidebar() {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebarOverlay').classList.remove('show');
  }
</script>
<script src="admin.js"></script>
</body>
</html>
